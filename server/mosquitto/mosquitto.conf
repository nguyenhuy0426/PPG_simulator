# Trial broker for the PPG simulator (docs/remote_mqtt.md).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT: only for a trusted LAN while testing. Close it (remove these two lines) on a public server.
listener 1883

# MQTT over TLS: what the Pi and the phone use over the internet.
listener 8883
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
cafile /mosquitto/config/certs/ca.crt
