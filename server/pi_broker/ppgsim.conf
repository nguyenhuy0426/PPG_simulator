# /etc/mosquitto/conf.d/ppgsim.conf — broker on the Pi (docs/remote_mqtt.md, "Broker on the Pi over Tailscale").
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/ppgsim/passwd
acl_file /etc/mosquitto/ppgsim/acl

# The simulator app on this Pi: plain MQTT that never leaves the machine.
listener 1883 127.0.0.1

# Phones over Tailscale (and the home LAN): TLS with the private CA's certificate for the Pi's tailnet name.
listener 8883
certfile /etc/mosquitto/ppgsim/server.crt
keyfile /etc/mosquitto/ppgsim/server.key
